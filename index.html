<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelowna Daily — Lake-side, on the record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFF3F1; --mist:#E3EAE7; --surface:#FFFFFF; --border:#DCE4E1;
    --ink:#0F2E38; --slate:#5C6F72;
    --teal:#1C6E7A; --teal-soft:#E4F0F1;
    --gold:#B07C22; --gold-soft:#FBF0DD;
    --plum:#7A3350; --plum-soft:#F5E7ED;
    --sage:#4C7457; --sage-soft:#E9F1E7;
    --azure:#2E5C8A; --azure-soft:#E5EDF6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
  a{color:inherit}

  .masthead{padding:2.4rem 1.5rem 0;max-width:1180px;margin:0 auto}
  .masthead-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
  .wordmark{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(2.4rem,5vw,3.6rem);letter-spacing:-.01em;line-height:1;margin:0}
  .wordmark .thin{font-weight:400;opacity:.55;font-style:normal}
  .dateline{font-family:'IBM Plex Mono',monospace;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);text-align:right}

  .waterline{width:100%;height:20px;display:block;overflow:visible;margin-top:1.1rem}
  .waterline path{fill:none;stroke:var(--teal);stroke-width:1.4;opacity:.55;stroke-dasharray:6 5;animation:drift 6s linear infinite}
  .waterline path.p2{stroke:var(--gold);opacity:.4;animation-duration:9s;animation-direction:reverse}
  @keyframes drift{to{stroke-dashoffset:-220}}
  @media (prefers-reduced-motion:reduce){.waterline path{animation:none}}

  .conditions{max-width:1180px;margin:1.1rem auto 0;padding:0 1.5rem}
  .cond-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.3rem;display:flex;align-items:center;gap:1.4rem;flex-wrap:wrap}
  .cond-now{display:flex;align-items:baseline;gap:.55rem}
  .cond-temp{font-family:'Newsreader',Georgia,serif;font-size:2.1rem;font-weight:500}
  .cond-desc{color:var(--slate);font-size:.92rem}
  .cond-label{font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
  .cond-meta{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--slate);text-align:right;line-height:1.6}

  .layout{max-width:1180px;margin:1.6rem auto 3rem;padding:0 1.5rem;display:grid;grid-template-columns:1.7fr 1fr;gap:1.6rem}

  .panel-title{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:1.15rem;margin:0 0 .9rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
  .panel-title .count{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--slate);font-weight:400}

  .filter-bar{display:flex;gap:.4rem;margin-bottom:.9rem}
  .filter-btn{font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.03em;text-transform:uppercase;background:transparent;border:1px solid var(--border);color:var(--slate);border-radius:6px;padding:.35rem .7rem;cursor:pointer}
  .filter-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  .river-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.95rem 1.1rem;margin-bottom:.7rem;display:block;text-decoration:none;transition:border-color .15s,transform .15s}
  @media (hover:hover){
    .river-item:hover{border-color:var(--teal);transform:translateX(2px)}
    button.refresh:hover{background:var(--teal)}
  }
  .river-item:active{border-color:var(--teal);background:#FBFDFC}
  .river-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem;flex-wrap:wrap}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.04em;text-transform:uppercase;padding:.18rem .5rem;border-radius:5px;font-weight:500}
  .pill.castanet{background:var(--teal-soft);color:var(--teal)}
  .pill.kelownanow{background:var(--gold-soft);color:var(--gold)}
  .pill.globalnews{background:var(--plum-soft);color:var(--plum)}
  .pill.capnews{background:var(--azure-soft);color:var(--azure)}
  .region{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--sage);background:var(--sage-soft);padding:.18rem .45rem;border-radius:5px}
  .river-time{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--slate)}
  .river-title{font-size:.98rem;line-height:1.35;font-weight:500}

  .side-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.1rem 1.2rem;margin-bottom:1.2rem}

  .fc-row{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem;padding:.5rem 0;border-bottom:1px solid var(--mist);font-size:.86rem}
  .fc-row:last-child{border-bottom:none}
  .fc-day{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--slate);min-width:38px}
  .fc-desc{flex:1;color:var(--slate);font-size:.8rem}
  .fc-temp{font-family:'IBM Plex Mono',monospace;font-size:.8rem;white-space:nowrap}
  .fc-temp .lo{color:var(--slate)}

  .refresh-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;font-size:.75rem;color:var(--slate)}
  button.refresh{font-family:'IBM Plex Sans',sans-serif;font-size:.78rem;font-weight:500;background:var(--ink);color:#fff;border:none;border-radius:7px;padding:.45rem .9rem;cursor:pointer}
  button.refresh:hover{background:var(--teal)}
  button:focus-visible,a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  .skeleton{height:16px;border-radius:5px;background:linear-gradient(90deg,var(--mist) 25%,#EFF6F4 37%,var(--mist) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;margin-bottom:.5rem}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  @media (prefers-reduced-motion:reduce){.skeleton{animation:none}}

  .empty-note{color:var(--slate);font-size:.85rem;font-style:italic}

  .diag-row{display:grid;grid-template-columns:auto 1fr;gap:.15rem .55rem;padding:.45rem 0;border-bottom:1px solid var(--mist);align-items:start}
  .diag-row:last-of-type{border-bottom:none}
  .dot{width:7px;height:7px;border-radius:50%;display:block;margin-top:.42rem}
  .dot.ok{background:var(--sage)}
  .dot.bad{background:var(--plum)}
  .diag-name{font-size:.85rem;font-weight:500}
  .diag-detail{grid-column:2;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--slate);line-height:1.45;word-break:break-word}

  /* ---------- Responsive ----------
     Three steps: the sidebar drops below the river, then the page tightens
     for phones, then the masthead stacks on the narrowest screens. */

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;gap:1.2rem}
    /* Sidebar panels pair up in the width they just reclaimed. */
    aside{display:grid;grid-template-columns:1fr 1fr;gap:0 1.2rem;align-items:start}
    .refresh-row{grid-column:1/-1}
  }

  @media (max-width:640px){
    aside{grid-template-columns:1fr}
    .masthead{padding:1.7rem 1rem 0}
    .conditions{padding:0 1rem}
    .layout{padding:0 1rem;margin:1.2rem auto;gap:1rem}
    .side-panel{padding:1rem 1.05rem;margin-bottom:1rem}
    .cond-card{padding:.9rem 1rem;gap:.45rem 1rem}
    .cond-desc{width:100%}
    /* Wind and humidity read better as a row than a right-aligned stack. */
    .cond-meta{margin-left:0;width:100%;text-align:left;display:flex;gap:1.1rem}
    .cond-meta br{display:none}
    .river-item{padding:.85rem .95rem}
    .river-title{font-size:1rem}
    .panel-title{font-size:1.08rem}
    /* Comfortable thumb targets. */
    .filter-btn,button.refresh{min-height:44px;padding:.5rem .95rem}
    .refresh-row{padding-bottom:.5rem}
  }

  @media (max-width:420px){
    .masthead-row{flex-direction:column;align-items:flex-start;gap:.2rem}
    .dateline{text-align:left;font-size:.7rem}
    .waterline{margin-top:.85rem}
    .cond-temp{font-size:1.85rem}
    .river-top{gap:.35rem}
    .filter-bar{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <h1 class="wordmark">Kelowna <span class="thin">Daily</span></h1>
    <div class="dateline" id="dateline">—</div>
  </div>
  <svg class="waterline" viewBox="0 0 1180 20" preserveAspectRatio="none" aria-hidden="true">
    <path class="p1" d="M0,10 Q20,2 40,10 T80,10 T120,10 T160,10 T200,10 T240,10 T280,10 T320,10 T360,10 T400,10 T440,10 T480,10 T520,10 T560,10 T600,10 T640,10 T680,10 T720,10 T760,10 T800,10 T840,10 T880,10 T920,10 T960,10 T1000,10 T1040,10 T1080,10 T1120,10 T1160,10 T1200,10"/>
    <path class="p2" d="M0,13 Q20,6 40,13 T80,13 T120,13 T160,13 T200,13 T240,13 T280,13 T320,13 T360,13 T400,13 T440,13 T480,13 T520,13 T560,13 T600,13 T640,13 T680,13 T720,13 T760,13 T800,13 T840,13 T880,13 T920,13 T960,13 T1000,13 T1040,13 T1080,13 T1120,13 T1160,13 T1200,13"/>
  </svg>
</header>

<section class="conditions">
  <div class="cond-card">
    <div class="cond-now">
      <span class="cond-label">Now</span>
      <span class="cond-temp" id="condTemp">—</span>
    </div>
    <div class="cond-desc" id="condDesc">Loading conditions for Kelowna…</div>
    <div class="cond-meta" id="condMeta"></div>
  </div>
</section>

<main class="layout">
  <section>
    <h2 class="panel-title">The River <span class="count" id="riverCount"></span></h2>
    <div class="filter-bar">
      <button class="filter-btn" id="fLocal" aria-pressed="true">Central Okanagan</button>
      <button class="filter-btn" id="fAll" aria-pressed="false">Everything</button>
    </div>
    <div id="river">
      <div class="skeleton" style="width:92%"></div>
      <div class="skeleton" style="width:78%"></div>
      <div class="skeleton" style="width:85%"></div>
      <div class="skeleton" style="width:70%"></div>
    </div>
  </section>

  <aside>
    <div class="side-panel">
      <h2 class="panel-title">Five days</h2>
      <div id="forecast"><div class="skeleton" style="width:90%"></div><div class="skeleton" style="width:75%"></div></div>
    </div>

    <div class="side-panel">
      <h2 class="panel-title">Feed status</h2>
      <div id="diagnostics"><p class="empty-note">Checking each source…</p></div>
    </div>

    <div class="refresh-row">
      <span id="lastUpdated">Not yet loaded</span>
      <button class="refresh" id="refreshBtn">Refresh</button>
    </div>
  </aside>
</main>

<script>
/* ---------------- Sources ----------------
   Every URL below has been confirmed to return actual XML.
   The /rss/ landing pages on castanet.net and kelownanow.com are
   human-readable directories, not feeds — hence the deeper paths. */
const FEEDS = [
  { key:'castanet',   label:'Castanet',            pill:'castanet',   url:'https://www.castanet.net/rss/mostrecent.xml' },
  { key:'kelownanow', label:'KelownaNow',          pill:'kelownanow', url:'https://www.kelownanow.com/api/rss/128' },
  { key:'globalnews', label:'Global News Okanagan',pill:'globalnews', url:'https://globalnews.ca/okanagan/feed/' },
  { key:'capnews',    label:'Capital News',        pill:'capnews',    url:'https://kelownacapnews.com/feed' }
];
const KELOWNA = { lat:49.888, lon:-119.496 };

/* Castanet is a Thompson-Okanagan-wide wire; it suffixes each headline
   with its region. These are the ones that count as local here. */
const LOCAL_REGIONS = ['kelowna','west kelowna','lake country','peachland','okanagan','vernon'];

const feedStatus = {};
let allItems = [];
let localOnly = true;

function stripHtml(s){ if(!s) return ''; const d=document.createElement('div'); d.innerHTML=s; return (d.textContent||'').trim(); }

function relTime(v){
  const d=new Date(v); if(isNaN(d)) return '';
  const m=Math.round((Date.now()-d.getTime())/60000);
  if(m<1) return 'just now';
  if(m<60) return m+'m ago';
  const h=Math.round(m/60); if(h<24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}

function parseXmlFeed(text){
  const doc=new DOMParser().parseFromString(text,'text/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('not valid XML');
  const atom=doc.documentElement.nodeName==='feed';
  const nodes=Array.from(doc.getElementsByTagName(atom?'entry':'item'));
  if(!nodes.length) throw new Error('no items in feed');
  return nodes.map(n=>{
    const g=t=>{const e=n.getElementsByTagName(t)[0];return e?e.textContent:'';};
    let link=g('link').trim();
    if(!link){ const le=n.getElementsByTagName('link')[0]; if(le&&le.getAttribute) link=le.getAttribute('href')||''; }
    return { title:stripHtml(g('title')), link,
             pubDate:g('pubDate')||g('published')||g('updated'),
             description:stripHtml(g('description')||g('summary')) };
  });
}

/* Tried in order. rss2json is first because it handles odd charsets and
   servers that reject plain proxies; the raw-XML proxies are the backstop. */
const TRANSPORTS = [
  { name:'rss2json', run: async u=>{
      const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u));
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(j.status!=='ok') throw new Error(j.message||'status '+j.status);
      if(!j.items||!j.items.length) throw new Error('no items');
      return j.items.map(i=>({title:stripHtml(i.title),link:i.link,pubDate:i.pubDate,description:stripHtml(i.description||i.content||'')}));
  }},
  { name:'allorigins', run: async u=>{
      const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u));
      if(!r.ok) throw new Error('HTTP '+r.status);
      return parseXmlFeed(await r.text());
  }},
  { name:'codetabs', run: async u=>{
      const r=await fetch('https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u));
      if(!r.ok) throw new Error('HTTP '+r.status);
      return parseXmlFeed(await r.text());
  }},
  { name:'thingproxy', run: async u=>{
      const r=await fetch('https://thingproxy.freeboard.io/fetch/'+u);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return parseXmlFeed(await r.text());
  }},
  { name:'direct', run: async u=>{
      const r=await fetch(u);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return parseXmlFeed(await r.text());
  }}
];

async function fetchFeed(url,key){
  const tried=[];
  for(const t of TRANSPORTS){
    try{
      const items=await t.run(url);
      feedStatus[key]={ok:true,via:t.name,count:items.length};
      return items;
    }catch(e){ tried.push(t.name+': '+e.message); }
  }
  feedStatus[key]={ok:false,tried};
  return [];
}

/* Open-Meteo sends CORS headers, so this needs no proxy at all. */
const WX = {0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Rime fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',
  66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',75:'Heavy snow',77:'Snow grains',
  80:'Showers',81:'Showers',82:'Heavy showers',85:'Snow showers',86:'Snow showers',
  95:'Thunderstorm',96:'Thunderstorm with hail',99:'Severe thunderstorm'};

async function loadWeather(){
  const url='https://api.open-meteo.com/v1/forecast?latitude='+KELOWNA.lat+'&longitude='+KELOWNA.lon+
    '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m'+
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'+
    '&timezone=America%2FVancouver&forecast_days=5';
  try{
    const r=await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json();
    feedStatus.weather={ok:true,via:'open-meteo',count:d.daily.time.length};

    const c=d.current;
    document.getElementById('condTemp').textContent=Math.round(c.temperature_2m)+'°C';
    document.getElementById('condDesc').textContent=
      (WX[c.weather_code]||'—')+' · feels like '+Math.round(c.apparent_temperature)+'°';
    document.getElementById('condMeta').innerHTML=
      'Wind '+Math.round(c.wind_speed_10m)+' km/h<br>Humidity '+c.relative_humidity_2m+'%';

    const dl=d.daily;
    document.getElementById('forecast').innerHTML=dl.time.map((t,i)=>{
      const day=i===0?'Today':new Date(t+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'});
      const pop=dl.precipitation_probability_max[i];
      return '<div class="fc-row"><span class="fc-day">'+day+'</span>'+
        '<span class="fc-desc">'+(WX[dl.weather_code[i]]||'')+(pop>20?' · '+pop+'%':'')+'</span>'+
        '<span class="fc-temp">'+Math.round(dl.temperature_2m_max[i])+'° <span class="lo">'+
        Math.round(dl.temperature_2m_min[i])+'°</span></span></div>';
    }).join('');
  }catch(e){
    feedStatus.weather={ok:false,tried:['open-meteo: '+e.message]};
    document.getElementById('condDesc').textContent='Weather service unreachable.';
    document.getElementById('forecast').innerHTML='<p class="empty-note">No forecast available.</p>';
  }
}

function renderRiver(){
  const el=document.getElementById('river');
  const items=localOnly?allItems.filter(i=>i.isLocal):allItems;
  document.getElementById('riverCount').textContent=items.length+' headlines';
  if(!items.length){
    el.innerHTML='<p class="empty-note">Nothing to show. Try Everything, or refresh.</p>';
    return;
  }
  el.innerHTML=items.slice(0,40).map(i=>
    '<a class="river-item" href="'+i.link+'" target="_blank" rel="noopener">'+
      '<div class="river-top"><span class="pill '+i.pill+'">'+i.source+'</span>'+
      (i.region?'<span class="region">'+i.region+'</span>':'')+
      '<span class="river-time">'+relTime(i.pubDate)+'</span></div>'+
      '<div class="river-title">'+i.title+'</div></a>').join('');
}

const DIAG_LABELS={castanet:'Castanet',kelownanow:'KelownaNow',globalnews:'Global News Okanagan',capnews:'Capital News',weather:'Open-Meteo'};
function renderDiagnostics(){
  document.getElementById('diagnostics').innerHTML=Object.keys(DIAG_LABELS).map(k=>{
    const s=feedStatus[k]; if(!s) return '';
    const detail=s.ok?(s.count+' items via '+s.via):s.tried.join(' · ');
    return '<div class="diag-row"><span class="dot '+(s.ok?'ok':'bad')+'"></span>'+
      '<span class="diag-name">'+DIAG_LABELS[k]+'</span>'+
      '<span class="diag-detail">'+detail+'</span></div>';
  }).join('');
}

async function loadAll(){
  const btn=document.getElementById('refreshBtn');
  btn.textContent='Loading…'; btn.disabled=true;

  const newsResults=await Promise.all(FEEDS.map(f=>fetchFeed(f.url,f.key)));
  await loadWeather();

  allItems=[];
  newsResults.forEach((items,idx)=>{
    const f=FEEDS[idx];
    items.forEach(i=>{
      // Castanet tags its region in a trailing parenthetical; pull it out.
      const m=i.title.match(/\s*\(([^()]{2,30})\)\s*$/);
      const region=m?m[1]:null;
      const title=m?i.title.slice(0,m.index).trim():i.title;
      const hay=((region||'')+' '+title).toLowerCase();
      allItems.push({
        ...i, title, region,
        source:f.label, pill:f.pill,
        // Feeds that are already local-only always count as local.
        isLocal: f.key!=='castanet' || LOCAL_REGIONS.some(r=>hay.includes(r))
      });
    });
  });
  allItems.sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));

  renderRiver();

  renderDiagnostics();

  const bad=Object.values(feedStatus).filter(s=>!s.ok).length;
  document.getElementById('lastUpdated').textContent=
    'Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+
    (bad?' · '+bad+' of 5 unreachable':' · all sources live');

  btn.textContent='Refresh'; btn.disabled=false;
}

function setFilter(local){
  localOnly=local;
  document.getElementById('fLocal').setAttribute('aria-pressed',String(local));
  document.getElementById('fAll').setAttribute('aria-pressed',String(!local));
  renderRiver();
}

function updateDateline(){
  document.getElementById('dateline').textContent=
    new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

document.getElementById('fLocal').addEventListener('click',()=>setFilter(true));
document.getElementById('fAll').addEventListener('click',()=>setFilter(false));
document.getElementById('refreshBtn').addEventListener('click',loadAll);
updateDateline();
loadAll();
setInterval(loadAll,30*60*1000);
setInterval(updateDateline,60*1000);
</script>
</body>
</html>
