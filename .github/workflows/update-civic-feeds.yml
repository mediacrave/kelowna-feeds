name: Update civic feeds

on:
  schedule:
    # Every four hours. Offset from :00 so it isn't competing with the
    # thundering herd of jobs everyone else schedules on the hour.
    - cron: '17 */4 * * *'
  workflow_dispatch:

# Needed so the job can push the refreshed snapshot back to the repo.
permissions:
  contents: write

concurrency:
  group: civic-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch City of Kelowna feeds
        run: node scripts/fetch-civic.mjs

      - name: Commit snapshot if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/civic.json
          if git diff --staged --quiet; then
            echo "Snapshot unchanged — nothing to commit."
          else
            git commit -m "Refresh City of Kelowna feed snapshot"
            git push
          fi
